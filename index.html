<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcendencies · Transcendencies Vault</title>
<!-- OGP: Discord и другие мессенджеры берут отсюда карточку превью ссылки.
     preview.png (1200×630) и favicon.png лежат рядом. -->
<meta property="og:site_name" content="Transcendencies Vault">
<meta property="og:title" content="Transcendencies · Transcendencies Vault">
<meta property="og:description" content="Карточка Transcendencies для Discord: пост, треки, комментарии">
<meta property="og:type" content="website">
<meta property="og:image" content="preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* ============================================================
   СТИЛИ — 1:1 по дизайн-системе эталона (R34 Vault, тёмная тема).
   Токены выцелены из сохранённого CSS референса:
   background #121414 · surfaces #1e2020/#282a2b/#333535 ·
   toolbar/footer #721199 · primary #ebb2ff · accent #57de9e
   ============================================================ */
:root{
  --bg:#121414;
  --bg-lowest:#0d0e0f;
  --bg-low:#1a1c1c;
  --bg-surface:#1e2020;
  --bg-high:#282a2b;
  --bg-highest:#333535;
  --text:#e2e2e2;
  --text-secondary:rgba(226,226,226,.75);
  --toolbar:#721199;
  --primary:#ebb2ff;
  --accent:#57de9e;
  --selected:rgba(235,178,255,.16);
  --divider:rgba(226,226,226,.12);
  --tag-copyright:#a30650;
  --tag-character:#285e14;
  --tag-artist:#a80616;
  --tag-general:#3649ac;
  --tag-meta:#005d52;
  --tag-system:#455367;
  --liked:rgb(49,196,141);
  --disliked:rgb(255,82,82);
  --premium:#f0b90b;
  --toolbar-h:64px;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block}
[hidden]{display:none !important}
.icon{width:1em;height:1em;vertical-align:-0.125em;fill:currentColor;flex-shrink:0}

/* ================= TOOLBAR (64px, фиолетовый) ================= */
.toolbar{position:sticky;top:0;z-index:40;height:var(--toolbar-h);
  background:var(--toolbar);display:flex;align-items:center;gap:4px;
  padding:0 8px;color:#fff}
.tb-icon{position:relative;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.tb-icon:hover{background:rgba(255,255,255,.12)}
.tb-badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;
  border-radius:999px;background:var(--primary);color:#520071;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.site-name{font-size:22px;letter-spacing:.25px;color:#fff;height:var(--toolbar-h);
  line-height:var(--toolbar-h);white-space:nowrap}
.site-name:hover{text-decoration:none}
.site-name span{font-weight:300}
.flex-spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--bg-highest);flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ================= SIDENAV (overlay) ================= */
.sidenav-backdrop{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.32);
  opacity:0;pointer-events:none;transition:opacity .2s}
.sidenav-backdrop.open{opacity:1;pointer-events:auto}
.sidenav{position:fixed;top:var(--toolbar-h);bottom:0;left:0;z-index:50;width:300px;
  background:var(--bg-surface);transform:translateX(-102%);transition:transform .25s ease;
  display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.4)}
.sidenav.open{transform:translateX(0)}
.sidenav-user{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--divider)}
.sidenav-user .avatar{width:40px;height:40px}
.sidenav-username{font-size:14px;font-weight:700}
.sidenav-sub{font-size:12px;color:var(--text-secondary)}
.sidenav-nav{flex:1;overflow:auto;padding:8px}
.sidenav-item{display:flex;align-items:center;gap:16px;width:100%;height:42px;
  padding:0 14px;border-radius:8px;font-size:14px;text-align:left;color:var(--text)}
.sidenav-item .icon{font-size:20px;color:var(--text-secondary)}
.sidenav-item:hover{background:rgba(226,226,226,.06)}
.sidenav-item.active{background:var(--selected);color:var(--primary)}
.sidenav-item.active .icon{color:var(--primary)}
.sidenav-badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--primary);color:#520071;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.sidenav-bottom{padding:8px;border-top:1px solid var(--divider)}
.sidenav-bottom .sidenav-item:last-child{margin-bottom:8px}
.sidenav-item.premium{color:var(--premium)}
.sidenav-item.premium .icon{color:var(--premium)}

/* ================= КАРКАС СТРАНИЦЫ ================= */
.page-content{min-height:calc(100vh - var(--toolbar-h));padding-bottom:24px}
.page-container{max-width:1280px;margin:0 auto;padding:0 24px}
.section{margin-top:28px}
.section-title{font-size:18px;font-weight:500;margin:0 0 12px}
.section-title .count{color:var(--text-secondary);font-weight:400;font-size:14px}
.section-title .chip{vertical-align:-8px;margin:0 10px 0 2px}

/* ================= ЧИПЫ (пills 36px, как у эталона) ================= */
.chip{display:inline-flex;align-items:center;height:36px;border-radius:999px;
  background:var(--bg-highest);color:var(--text);overflow:hidden;
  transition:filter .15s;vertical-align:middle}
.chip:hover{filter:brightness(1.2)}
.chip-part{display:flex;align-items:center;height:100%;padding:0 16px;position:relative}
.chip-part .label{font-size:14px;line-height:14px}
.chip-part .icon{font-size:18px}
.chip-part .icon + .label{margin-left:8px}
.chip--small{height:32px}
.chip--small .chip-part{padding:0 12px}
.chip--small .label{font-size:13px}
.chip--tag-copyright{background:var(--tag-copyright)}
.chip--tag-character{background:var(--tag-character)}
.chip--tag-artist{background:var(--tag-artist)}
.chip--tag-general{background:var(--tag-general)}
.chip--tag-meta{background:var(--tag-meta)}
.chip--tag-system{background:var(--tag-system)}
.chip--tag-copyright .label,.chip--tag-character .label,.chip--tag-artist .label,
.chip--tag-general .label,.chip--tag-meta .label,.chip--tag-system .label{color:#fff}
.chip--tonal{height:32px;background:var(--bg-highest)}
.chip--tonal .label{font-size:13px;color:var(--text)}
.chip--tonal .icon{font-size:16px;color:var(--text-secondary)}
.chip--liked .icon{color:var(--liked)}
.chip--ghost{background:transparent;border:1px solid var(--divider);height:32px}
.chip--ghost .label{font-size:13px;color:var(--text-secondary)}

/* ================= HOME: визитка + поиск + сетка ================= */
.home-wrap{padding-top:20px}
/* карточка профиля (1:1 по референсу u/страницы) */
.profile-card2{max-width:620px;margin:0 auto 20px;background:var(--bg-surface);
  border-radius:16px;padding:20px 22px 0}
.pc-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.avatar-xl{width:104px;height:104px}
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--text)}
.profile-name2{font-size:20px;font-weight:700}
.profile-handle{font-size:13px;color:var(--text-secondary);margin-top:1px}
.profile-role{font-size:13px;color:var(--text-secondary);margin-top:8px}
.profile-bio2{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.5}
.profile-stats2{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--text-secondary)}
.profile-stats2 b{color:var(--text);font-size:13px}
.profile-tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto}
.ptab{padding:10px 12px;font-size:13px;font-weight:500;color:var(--text-secondary);
  border-bottom:2px solid transparent;white-space:nowrap}
.ptab:hover{color:var(--text)}
.ptab.active{color:var(--text);border-bottom-color:var(--primary)}
/* «витринная» сетка вкладок Bookmarks: 2 мелких слева + 1 большой справа */
.featured-grid{display:grid;grid-template-columns:1fr 1.9fr;gap:12px;margin-bottom:12px}
.post-card--big{grid-column:2;grid-row:1/3;display:flex;flex-direction:column}
.post-card--big .card-media{aspect-ratio:auto;flex:1;min-height:220px}
.featured-grid--solo{grid-template-columns:1fr;max-width:820px;margin-left:auto;margin-right:auto}
.featured-grid--solo .post-card--big{grid-column:auto;grid-row:auto}
.featured-grid--solo .post-card--big .card-media{min-height:0;aspect-ratio:auto}

/* теги сразу на большой карточке (как на странице поста) */
.card-desc{font-size:14px;color:var(--text-secondary);margin-top:10px;line-height:1.4}
/* комменты под постом (на карточке, без клика) */
.card-comments{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.card-cmt{display:flex;gap:10px;align-items:flex-start}
.card-cmt .avatar{width:32px;height:32px;flex:none}
.card-cmt-head{font-size:13px;color:var(--text)}
.card-cmt-head b{font-weight:600}
.card-cmt-head span{color:var(--text-secondary);font-size:12px;margin-left:8px}
.card-cmt-text{font-size:13px;color:var(--text-secondary);margin-top:2px;line-height:1.4}
.card-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.card-tags .chip{height:30px}
.card-tags .chip-part{padding:0 12px}
.card-tags .chip-part .label{font-size:12px;line-height:12px}

/* History: строки треков (YouTube-стиль) */
.track-row{display:flex;gap:14px;padding:12px 6px;text-decoration:none}
.track-row:hover .track-title{color:var(--primary)}
.track-thumb{position:relative;width:300px;flex:none;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg-surface)}
.track-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.track-dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.85);color:#fff;font-size:12px;font-weight:600;padding:2px 6px;border-radius:4px}
.track-info{display:flex;flex-direction:column;min-width:0}
.track-title{font-size:16px;font-weight:600;color:var(--text);line-height:1.35;transition:color .15s}
.track-meta{font-size:13px;color:var(--text-secondary);margin-top:4px}
.track-channel{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-secondary);margin-top:8px}
.track-av{width:20px;height:20px;border-radius:50%;display:block}
.track-desc{font-size:13px;color:var(--text-secondary);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* история (History) */
.history-item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--divider)}
.history-item:first-child{border-top:0;padding-top:2px}
.history-link{font-size:12px;display:inline-block;margin-top:4px}
/* «18+» пост: blur, плашка, гейт да/нет */
.nsfw-blur{filter:blur(16px) saturate(.75);transform:scale(1.06)}
.post-media img.nsfw-blur{filter:blur(28px) saturate(.7);transform:scale(1.15)}
.badge-18{position:absolute;top:6px;left:6px;background:#930100;color:#ffdad4;
  font-size:11px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px}
.nsfw-gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:rgba(0,0,0,.6);text-align:center;padding:20px;z-index:3}
.gate-18{font-size:42px;font-weight:800;color:#ffdad4;background:#930100;
  padding:8px 22px;border-radius:14px;letter-spacing:1px}
.gate-text{font-size:13px;color:var(--text-secondary);max-width:360px}
.gate-hint{font-size:12px;opacity:.85}
.gate-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gate-yes{background:var(--primary);color:#520071;font-weight:700;padding:9px 20px;border-radius:999px;font-size:13px}
.gate-yes:hover{filter:brightness(1.1)}
.gate-no{border:1px solid var(--divider);color:var(--text-secondary);padding:9px 20px;border-radius:999px;font-size:13px}
.gate-no:hover{color:var(--text)}
.search-box{display:flex;align-items:center;gap:10px;height:44px;
  background:var(--bg-high);border-radius:999px;padding:0 18px;margin-bottom:20px}
.search-box .icon{font-size:20px;color:var(--text-secondary)}
.search-box input{flex:1;background:none;border:0;outline:none;color:var(--text);font:14px Roboto,system-ui,sans-serif}
.search-box input::placeholder{color:var(--text-secondary)}
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.suggested-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.post-card{display:block;background:var(--bg-high);border-radius:var(--radius);
  overflow:hidden;color:var(--text);transition:background .15s}
.post-card:hover{background:var(--bg-surface);text-decoration:none}
.card-media{position:relative;aspect-ratio:4/3;background:var(--bg-highest)}
.card-media img{width:100%;height:100%;object-fit:cover}
.card-play{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;
  font-size:11px;font-weight:600}
.card-play .icon{font-size:14px}
.card-stats{display:flex;align-items:center;gap:12px;padding:8px 10px;
  font-size:12px;color:var(--text-secondary)}
.card-stats .icon{font-size:14px;margin-right:4px}
.card-stats .stat-like{color:var(--text)}
.card-stats .stat-like .icon{color:var(--liked)}
.btn-ghost{display:block;margin:16px auto 0;padding:8px 18px;border-radius:999px;
  border:1px solid var(--divider);color:var(--text-secondary);font-size:13px;font-weight:500}
.btn-ghost:hover{background:rgba(226,226,226,.06);color:var(--text)}

/* ================= STRANICA POSTA ================= */
.post-wrap{padding-top:20px}
.post-media-wrap{position:relative;max-width:1000px;margin:0 auto}
.post-media{position:relative;background:#000;border-radius:var(--radius);display:flex;
  align-items:center;justify-content:center;min-height:320px;overflow:hidden}
.post-media img{max-width:100%;max-height:74vh;object-fit:contain}
.post-nav-row{display:flex;justify-content:space-between;align-items:center;
  max-width:1000px;margin:0 auto 12px}
.post-nav-link{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
  color:var(--text);padding:6px 12px;border-radius:8px}
.post-nav-link .icon{font-size:16px}
.post-nav-link:hover{background:var(--bg-high)}
.post-desc{font-size:14px;line-height:1.5;margin-top:14px}
.post-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.post-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.post-meta{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:18px;
  margin-top:14px;font-size:13px;color:var(--text-secondary)}
.post-meta .icon{font-size:15px;margin-right:5px;vertical-align:-2px}
.post-source{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;
  margin-top:8px;font-size:13px;color:var(--text-secondary)}
.post-source .icon{font-size:15px;vertical-align:-2px}
.post-source a{word-break:break-all}

/* ================= КОММЕНТАРИИ ================= */
.comment-input-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.comment-input-row .avatar{width:36px;height:36px}
.comment-input{flex:1;height:44px;border-radius:999px;background:var(--bg-high);
  display:flex;align-items:center;padding:0 18px;color:var(--text-secondary);
  font-size:14px;cursor:text}
.comment-input:hover{background:var(--bg-highest)}
.comment-form{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;
  background:var(--bg-surface);border-radius:var(--radius);padding:14px}
.comment-form input,.comment-form textarea{background:var(--bg-high);border:1px solid var(--divider);
  border-radius:8px;color:var(--text);padding:9px 12px;font:14px Roboto,system-ui,sans-serif;outline:none;resize:vertical}
.comment-form input:focus,.comment-form textarea:focus{border-color:var(--primary)}
.comment-form textarea{min-height:70px}
.comment-form .row{display:flex;gap:8px;justify-content:flex-end}
.comment-form .send{background:var(--primary);color:#520071;font-weight:700;
  padding:8px 18px;border-radius:999px;font-size:13px}
.comment-form .send:hover{filter:brightness(1.1)}
.comment{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--divider)}
.comment:first-of-type{border-top:0}
.comment .avatar{width:36px;height:36px}
.cmt-body{flex:1;min-width:0}
.comment-header{display:flex;align-items:baseline;gap:8px}
.cmt-name{font-size:13px;font-weight:700;color:var(--text)}
.cmt-time{font-size:12px;color:var(--text-secondary)}
.cmt-text{font-size:14px;line-height:20px;margin-top:4px;overflow-wrap:anywhere}
.cmt-actions{display:flex;align-items:center;gap:4px;margin-top:8px}
.cmt-actions .chip{height:30px}
.cmt-actions .chip-part{padding:0 10px}
.cmt-actions .chip-part .icon{font-size:15px;color:var(--text-secondary)}
.cmt-actions .chip-part .label{font-size:12px;color:var(--text-secondary)}
.cmt-actions .chip-part .icon.liked{color:var(--liked)}
.cmt-actions .divider{width:1.5px;height:20px;background:var(--divider);margin:0 4px}

/* ================= PLAYLISTS ================= */
.tabs{display:inline-flex;background:var(--bg-high);border-radius:999px;padding:3px;margin-bottom:14px}
.tab{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-secondary)}
.tab.active{background:var(--selected);color:var(--primary)}
.playlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.playlist-card{background:var(--bg-high);border-radius:var(--radius);padding:14px}
.playlist-name{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;
  margin-bottom:10px;color:var(--text)}
.playlist-name .icon{font-size:20px;color:var(--primary)}
.playlist-stats{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text-secondary)}
.playlist-stats .icon{font-size:15px;margin-right:5px;vertical-align:-2px}
.pagination{display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:16px;font-size:13px;color:var(--text-secondary)}
.pagination button{width:36px;height:36px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;color:var(--text-secondary);font-size:20px}
.pagination button:hover{background:rgba(226,226,226,.06);color:var(--text)}

/* ================= FOOTER (фиолетовый, как toolbar) ================= */
.footer{background:var(--toolbar);color:#fff;margin-top:32px}
.footer-inner{max-width:1280px;margin:0 auto;padding:20px 24px;
  display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.footer .title{font-size:13px;color:#fff;opacity:.92;max-width:760px}
.footer-links{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.footer-links a{color:#fff;font-size:13px;opacity:.9}
.footer-links a:hover{opacity:1}

/* ================= ПРОЧЕЕ ================= */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;
  background:var(--bg-highest);border:1px solid var(--divider);padding:10px 18px;
  font-size:13px;color:var(--text);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}
.toast-title{font-weight:700;margin-bottom:3px}
.heart-fx{position:fixed;z-index:98;font-size:28px;pointer-events:none;
  animation:heartUp 1s ease-out forwards}
@keyframes heartUp{
  0%{transform:translateY(0) scale(.6);opacity:1}
  100%{transform:translateY(-140px) scale(1.6);opacity:0}
}
.empty{padding:60px 0;text-align:center;color:var(--text-secondary)}

/* ================= МОБИЛКА ================= */
@media (max-width:900px){
  .site-name{font-size:18px}
  .toolbar{gap:0;padding:0 4px}
  .posts-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .featured-grid{grid-template-columns:1fr}
  .post-card--big{grid-column:auto;grid-row:auto;min-height:0}
  .post-card--big .card-media{aspect-ratio:4/3;min-height:0}
  .featured-grid--solo .post-card--big .card-media{min-height:0;aspect-ratio:auto}
  .track-thumb{width:170px}
  .track-title{font-size:14px}
  .post-media{min-height:220px}
}
</style>
</head>

<!-- ================= TOOLBAR ================= -->

/* Теги: "слово" = синий; "слово=pink/green/red/teal/gray" = цветной; { t, c } = старый формат */
const TAG_COLORS = { pink: "copyright", green: "character", red: "artist", blue: "general", teal: "meta", gray: "system" };
POSTS.forEach(p => {
  p.tags = p.tags.map(t => {
    if (typeof t !== "string") return t;
    const [name, color] = t.split("=");
    return { t: name.trim(), c: TAG_COLORS[color ? color.trim() : ""] || "general" };
  });
});

function tagCount(name){ return POSTS.filter(p => p.tags.some(t => t.t === name)).length; }

function icon(n){ return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="' + (ICONS[n] || "") + '"/></svg>'; }

const esc = (s) => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtK(n){
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + " M";
  if (n >= 1000) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + " K";
  return String(n);
}
/* views: число → fmtK ("3.9 K"); строка → как есть ("многа") */
const fmtViews = (v) => (typeof v === "string" ? v : fmtK(v));

/* --- Аватар-заглушка (SVG data-URI, инициал на тёмном фоне) --- */
function avatarUri(ch){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">' +
    '<rect width="64" height="64" fill="#333535"/>' +
    '<text x="32" y="42" font-size="30" text-anchor="middle" fill="#ebb2ff" font-family="sans-serif">' + esc(ch || "?") + '</text></svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* --- Картинка-заглушка (SVG data-URI), пока img: null --- */
const EMOJIS = ["🐈","","","","💻","","",""];
function placeholderFor(p){
  const hue = (p.id * 47) % 360;
  const emoji = EMOJIS[p.id % EMOJIS.length];
  const short = p.title.length > 34 ? p.title.slice(0, 33) + "…" : p.title;
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">' +
    '<rect width="800" height="600" fill="hsl(' + hue + ',28%,16%)"/>' +
    '<rect x="16" y="16" width="768" height="568" rx="18" fill="none" ' +
    'stroke="hsl(' + hue + ',45%,34%)" stroke-width="3" stroke-dasharray="12 10"/>' +
    '<text x="40" y="60" font-size="22" fill="#98a0ad" font-family="sans-serif">id ' + p.id + '</text>' +
    '<text x="400" y="330" font-size="150" text-anchor="middle">' + emoji + '</text>' +
    '<text x="400" y="430" font-size="26" text-anchor="middle" fill="#e2e2e2" font-family="sans-serif">' + esc(short) + '</text>' +
    '<text x="400" y="468" font-size="18" text-anchor="middle" fill="#98a0ad" font-family="sans-serif">заглушка: вставь свою ссылку в поле img</text>' +
    '<text x="760" y="566" font-size="18" text-anchor="end" fill="#98a0ad" font-family="sans-serif">' + esc(fmtViews(p.views)) + ' views</text>' +
    '</svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* ---------- State ---------- */
const state = { query: "", hot: false, currentPostId: null, expanded: false,
  playlistTab: "updated", sidenavOpen: false, profileTab: "bookmarks",
  revealed: new Set() };

/* ---------- Тост ---------- */
let toastTimer = null;
function toast(msg, title){
  let el = document.querySelector(".toast");
  if (!el){ el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.innerHTML = (title ? '<div class="toast-title">' + esc(title) + "</div>" : "") + "<div>" + esc(msg) + "</div>";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ---------- Toolbar / Sidenav / Footer ---------- */
/* Аватар: динамичный (PROFILE.avatar, напр. URL из Discord CDN) + fallback-заглушка,
   если ссылка «умрёт» (сменил аву на Discord и т.п.) */
function avatarImg(){
  const fb = avatarUri(PROFILE.user[0].toUpperCase());
  return '<img src="' + (PROFILE.avatar || fb) + '" onerror="this.onerror=null;this.src=\'' + fb + '\'" alt="">';
}

function renderChrome(){
  $("#logo").innerHTML = SITE.name;
  document.title = SITE.title;
  $("#sidenav-btn").innerHTML = icon("menu");
  $("#notif-btn").insertAdjacentHTML("afterbegin", icon("notifications"));
  $("#avatar-btn").innerHTML = avatarImg();
  $("#sidenav-avatar").innerHTML = avatarImg();
  $("#sidenav-name").textContent = PROFILE.user;

  $("#sidenav-nav").innerHTML = NAV.map(n =>
    '<button class="sidenav-item" data-action="' + esc(n.action) + '" data-label="' + esc(n.label) + '">' +
    icon(n.icon) + '<span>' + esc(n.label) + '</span>' +
    (n.badge ? '<span class="sidenav-badge">' + n.badge + '</span>' : '') + '</button>').join("");

  const bottom = document.querySelectorAll(".sidenav-bottom .sidenav-item");
  bottom.forEach((b, i) => {
    const item = SIDENAV_BOTTOM[i];
    b.innerHTML = icon(item.icon) + '<span>' + esc(item.label) + '</span>';
    if (item.premium) b.classList.add("premium");
  });

  $("#footer-title").textContent = SITE.footerTitle;
  $("#footer-links").innerHTML = FOOTER_LINKS.map(l =>
    '<a href="#" data-toast="иди нахуй" data-toast-title="Transcendencies">' + esc(l) + "</a>").join("");

  $("#search-box").insertAdjacentHTML("afterbegin", icon("search"));
  renderProfile();
}

/* ---------- Визитка: карточка профиля (1:1 по референсу u/страницы) ---------- */
function renderProfile(){
  const totalC = POSTS.reduce((a, p) => a + p.comments.length, 0);
  $("#profile-card").innerHTML =
    '<div class="pc-top">' +
      '<a class="avatar avatar-xl">' + avatarImg() + "</a>" +
    "</div>" +
    '<div class="profile-name2">' + esc(PROFILE.user) + "</div>" +
    '<div class="profile-handle">' + esc(PROFILE.handle) + "</div>" +
    '<div class="profile-role">в Vault с ' + esc(PROFILE.since) + "</div>" +
    '<div class="profile-bio2">' + esc(PROFILE.bio) + "</div>" +
    '<div class="profile-stats2">' +
      "<span><b>" + POSTS.length + "</b> post</span>" +
      "<span><b>" + totalC + "</b> comments</span>" +
    "</div>" +
    '<div class="profile-tabs" id="profile-tabs">' +
      '<button class="ptab" type="button" data-ptab="bookmarks">Bookmarks (' + POSTS.length + ")</button>" +
      '<button class="ptab" type="button" data-ptab="history">History (' + TRACKS.length + ")</button>" +
      '<button class="ptab" type="button" data-ptab="playlists">Playlists (' + PLAYLISTS.length + ")</button>" +
      '<button class="ptab" type="button" data-ptab="subs">Subscriptions</button>' +
    "</div>";
  document.querySelectorAll("#profile-tabs .ptab").forEach(t => {
    t.classList.toggle("active", t.dataset.ptab === state.profileTab);
    t.onclick = () => { state.profileTab = t.dataset.ptab; renderProfile(); };
  });

/* ---------- Контент вкладок профиля ---------- */
function playlistCardHtml(pl){
  return '<div class="playlist-card">' +
    '<div class="playlist-name">' + icon("playlist_play") + esc(pl.name) + "</div>" +
    '<div class="playlist-stats">' +
      "<span>" + icon("playlist_play") + pl.items + "</span>" +
      (pl.likes ? "<span>" + icon("favorite") + pl.likes + "</span>" : "") +
      (pl.comments ? "<span>" + icon("forum") + pl.comments + "</span>" : "") +
      "<span>" + icon("people") + pl.members + "</span>" +
    "</div></div>";
}

function bookmarksContent(){
  const list = visiblePosts();
  if (!list.length) return '<p class="empty">Ничего не нашлось. Попробуй другой запрос.</p>';
  if (list.length === 1){
    return '<div class="featured-grid featured-grid--solo">' + cardHtml(list[0], true) + "</div>";
  }
  const big = list.find(p => p.nsfw) || list[0];
  const smalls = list.filter(p => p !== big).slice(0, 2);
  const rest = list.filter(p => p !== big && smalls.indexOf(p) === -1);
  let html = "";
  if (smalls.length === 2){
    /* витрина: 2 мелких слева + 1 большой справа (большой = «18+» пост) */
    html += '<div class="featured-grid">' + cardHtml(smalls[0]) + cardHtml(smalls[1]) + cardHtml(big, true) + "</div>";
  }
  if (rest.length) html += '<div class="posts-grid">' + rest.map(p => cardHtml(p)).join("") + "</div>";
  html += '<button class="btn-ghost" type="button" data-toast="Show more — в каркасе уже все посты">Show more</button>';
  return html;
}

/* ---------- История: строка трека (YouTube-стиль: обложка слева, инфо справа) ---------- */
function trackRowHtml(t){
  return '<a class="track-row" href="' + esc(t.src) + '" target="_blank" rel="noopener">' +
    '<div class="track-thumb">' +
      '<img src="' + esc(t.img) + '" alt="' + esc(t.title) + '" loading="lazy">' +
      '<span class="track-dur">' + esc(t.video) + "</span>" +
    "</div>" +
    '<div class="track-info">' +
      '<div class="track-title">' + esc(t.title) + "</div>" +
      '<div class="track-meta">' + esc(t.views) + " · " + esc(t.when) + "</div>" +
      '<div class="track-channel"><img class="track-av" src="' + avatarUri("S") + '" alt="">Sematary</div>' +
      '<div class="track-desc">' + esc(t.desc) + "</div>" +
    "</div></a>";
}

function renderProfileContent(){
  const box = $("#profile-content");
  if (state.profileTab === "bookmarks"){
    box.innerHTML = bookmarksContent();
  } else if (state.profileTab === "history"){
    box.innerHTML = TRACKS.length
      ? TRACKS.map(trackRowHtml).join("")
      : '<p class="empty">Пока пусто.</p>';
  } else if (state.profileTab === "playlists"){
    box.innerHTML = PLAYLISTS.length
      ? '<div class="playlist-grid">' + PLAYLISTS.map(playlistCardHtml).join("") + "</div>"
      : '<p class="empty">Пока пусто.</p>';
  } else {
    box.innerHTML = '<p class="empty">Подписок пока нет. Скука в чистом виде.</p>';
  }
}

function setSidenav(open){
  state.sidenavOpen = open;
  $("#sidenav").classList.toggle("open", open);
  $("#sidenav-backdrop").classList.toggle("open", open);
}

/* ---------- HOME ---------- */
function visiblePosts(){
  let list = POSTS.slice();
  if (state.hot) list.sort((a, b) => b.rating - a.rating);
  if (state.query){
    const q = state.query.toLowerCase();
    list = list.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.tags.some(t => t.t.toLowerCase().includes(q)));
  }
  return list;
}

function cardHtml(p, big){
  const nsfw = p.nsfw && !state.revealed.has(p.id);
  /* комменты сразу под постом (без клика по посту) */
  const cmts = (big && p.comments.length)
    ? '<div class="card-comments">' + p.comments.map(c =>
        '<div class="card-cmt">' +
          (c.user === PROFILE.user
            ? '<span class="avatar">' + avatarImg() + "</span>"
            : '<span class="avatar"><img src="' + avatarUri(String(c.user || "?").charAt(0).toUpperCase()) + '" alt=""></span>') +
          '<div class="card-cmt-body"><div class="card-cmt-head"><b>' + esc(c.user) +
          '</b><span>' + esc(c.when || "") + "</span></div>" +
          '<div class="card-cmt-text">' + esc(c.text) + "</div></div>" +
        "</div>").join("") + "</div>"
    : "";
  return '<div class="post-card' + (big ? " post-card--big" : "") + '">' +
    '<div class="card-media">' +
      '<img class="' + (nsfw ? "nsfw-blur" : "") + '" src="' + (p.img || placeholderFor(p)) + '" alt="' + esc(p.title) + '" loading="lazy">' +
      (nsfw ? '<span class="badge-18">18+</span>' : "") +
      (p.video ? '<span class="card-play">' + icon("play_arrow") + esc(p.video) + "</span>" : "") +
    "</div>" +
    '<div class="card-stats">' +
      "<span>" + icon("visibility") + fmtViews(p.views) + "</span>" +
      '<span class="stat-like">' + icon("favorite") + fmtK(p.rating) + "</span>" +
      "<span>" + icon("comment") + p.comments.length + "</span>" +
    "</div>" +
    (big && p.desc ? '<div class="card-desc">' + esc(p.desc) + "</div>" : "") +
    (big ? '<div class="card-tags">' + p.tags.map(t =>
      '<span class="chip chip--tag-' + esc(t.c) + '"><span class="chip-part"><span class="label">' + esc(t.t) + "</span></span></span>").join("") + "</div>" : "") +
    cmts +
    "</div>";
}

/* (лендинг теперь = страница профиля; сетка постов живёт во вкладке Bookmarks) */

/* ---------- STRANICA POSTA ---------- */
function tagChips(p, expanded){
  const show = expanded ? p.tags : p.tags.slice(0, 10);
  let html = show.map(t => {
    const n = tagCount(t.t);
    return '<button class="chip chip--tag-' + esc(t.c) + '" data-tag="' + esc(t.t) + '" title="' +
      esc(t.t) + ' · ' + n + ' ' + plural(n, "пост", "поста", "постов") + '">' +
      '<span class="chip-part"><span class="label">' + esc(t.t) + "</span></span></button>";
  }).join("");
  if (!expanded && p.tags.length > 10)
    html += '<button class="chip chip--tonal" id="tags-more"><span class="chip-part"><span class="label">Show more (+' +
      (p.tags.length - 10) + ")</span></span></button>";
  return html;
}

function renderPost(p){

      "</div>" +
    "</section>" +
    "</div>";

  /* обработчики страницы поста */
  const im = $("#post-main-img");
  im.onerror = () => { im.onerror = null; im.src = placeholderFor(p); };

  $("#post-prev").onclick = () => navPost(-1);
  $("#post-next").onclick = () => navPost(1);
  $("#fav-btn").onclick = (e) => {
    p.rating++;
    const lbl = e.currentTarget.querySelector(".label");
    lbl.textContent = fmtK(p.rating);
    const ic = e.currentTarget.querySelector(".icon");
    ic.innerHTML = icon("favorite");
    e.currentTarget.classList.add("chip--liked");
    heartFx(e.currentTarget.getBoundingClientRect());
  };
  const gy = $("#gate-yes");
  if (gy){
    gy.onclick = () => { state.revealed.add(p.id); renderPost(p); toast("А тут вообще-то ничего не было 😅"); };
    $("#gate-no").onclick = () => toast("Мудро. Пусть остаётся замыленным");
  }
  $("#bm-btn").onclick = () => toast("Добавлено в закладки (локально)");
  $("#pl-btn").onclick = () => toast("Add to playlist — псевдо-ссылка, сделаем позже");
  $("#more-btn").onclick = () => toast("Ещё — псевдо-ссылка");

  const openForm = () => { $("#comment-form").hidden = false; $("#cmt-text").focus(); };
  $("#cmt-open").onclick = openForm;
  $("#cmt-cancel").onclick = () => { $("#comment-form").hidden = true; };
  $("#comment-form").onsubmit = (e) => {
    e.preventDefault();
    const text = $("#cmt-text").value.trim();
    if (!text) return;
    p.comments.push({
      user: $("#cmt-user").value.trim() || PROFILE.user,
      text, when: "только что",
      likes: 0,
    });
    renderPost(p);
    toast("Комментарий добавлен (локально, не сохраняется)");
  };

  $("#pl-tabs").addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (!t) return;
    state.playlistTab = t.dataset.tab;
    renderPlaylists();
  });
  renderPlaylists();
}

function renderPlaylists(){
  let list = PLAYLISTS.slice();
  if (state.playlistTab === "rated")    list.sort((a, b) => b.likes - a.likes);
  if (state.playlistTab === "followed") list.sort((a, b) => b.members - a.members);
  const cards = list.map(playlistCardHtml).join("");
  /* секция Playlists на странице поста */
  [ ["#playlist-grid", "#pl-tabs"] ].forEach(([gSel, tSel]) => {
    const g = $(gSel);
    if (!g) return;
    g.innerHTML = cards;
    document.querySelectorAll(tSel + " .tab").forEach(t =>
      t.classList.toggle("active", t.dataset.tab === state.playlistTab));
  });
  const cnt = $("#pl-count");
  if (cnt) cnt.textContent = "Showing 1 - " + list.length + " of " + list.length;
}

function navPost(dir){
  const idx = POSTS.findIndex(x => x.id === state.currentPostId);
  const next = POSTS[(idx + dir + POSTS.length) % POSTS.length];
  location.hash = "#post/" + next.id;
}

function heartFx(rect){
  const h = document.createElement("span");
  h.className = "heart-fx";
  h.textContent = "💜";
  h.style.left = (rect.left + rect.width / 2 - 14) + "px";
  h.style.top = (rect.top - 10) + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 1000);
}

/* ---------- Роутинг ---------- */
/* ---------- Страница тега (как на эталоне) ---------- */
function renderTag(name){
  const n = tagCount(name);
  const found = POSTS.flatMap(p => p.tags).find(t => t.t === name);
  const cat = found ? found.c : "general";
  $("#tag-title").innerHTML = "Tag: " +
    '<span class="chip chip--small chip--tag-' + esc(cat) + '"><span class="chip-part"><span class="label">' +
    esc(name) + '</span></span></span>' +
    ' <span class="count">(' + n + ' ' + plural(n, "пост", "поста", "постов") + ")</span>";
  const list = POSTS.filter(p => p.tags.some(t => t.t === name));
  $("#tag-grid").innerHTML = list.map(cardHtml).join("");
  $("#tag-empty").hidden = list.length > 0;
}

function route(){
  const m = location.hash.match(/^#post\/(\d+)/);
  if (m){
    const p = POSTS.find(x => x.id === Number(m[1]));
    if (p){
      state.currentPostId = p.id;
      state.expanded = false;
      $("#view-home").hidden = true;
      $("#view-post").hidden = false;
      $("#view-tag").hidden = true;
      renderPost(p);
      window.scrollTo(0, 0);
      return;
    }
  }
  const mt = decodeURIComponent(location.hash).match(/^#tag\/(.+)$/);
  if (mt){
    state.currentPostId = null;
    $("#view-post").hidden = true;
    $("#view-home").hidden = true;
    $("#view-tag").hidden = false;
    renderTag(mt[1]);
    window.scrollTo(0, 0);
    return;
  }
  state.currentPostId = null;
  $("#view-post").hidden = true;
  $("#view-tag").hidden = true;
  $("#view-home").hidden = false;
  renderProfile();
}
window.addEventListener("hashchange", route);

/* ---------- События общего каркаса ---------- */
/* Теги на странице поста: делегирование на #view-post (выживает после re-render) */
$("#view-post").addEventListener("click", (e) => {
  const p = POSTS.find(x => x.id === state.currentPostId);
  if (!p) return;
  if (e.target.closest("#tags-more")){
    state.expanded = true;
    $("#post-tags").innerHTML = tagChips(p, true);
    return;
  }
  const chip = e.target.closest("#post-tags [data-tag]");
  if (chip){
    location.hash = "#tag/" + encodeURIComponent(chip.dataset.tag);
  }
});

$("#sidenav-btn").addEventListener("click", () => setSidenav(!state.sidenavOpen));
$("#sidenav-backdrop").addEventListener("click", () => setSidenav(false));
$("#sidenav-nav").addEventListener("click", (e) => {
  const b = e.target.closest(".sidenav-item");
  if (!b) return;
  toast("иди нахуй", "Transcendencies");
  setSidenav(false);
});
const CHARITY_URL = "https://www.donorschoose.org/"; // куда ведёт Upgrade Account
document.querySelectorAll(".sidenav-bottom .sidenav-item").forEach(b =>
  b.addEventListener("click", () => {
    if (b.textContent.trim() === "Upgrade Account"){
      window.open(CHARITY_URL, "_blank"); // Upgrade Account → сайт благотворительности
    } else {
      toast("иди нахуй", "Transcendencies");
    }
  }));
$("#logo").addEventListener("click", (e) => {
  e.preventDefault();
  state.hot = false; state.query = "";
  $("#search-input").value = "";
  if (location.hash) location.hash = ""; else route();
});
$("#notif-btn").addEventListener("click", () => toast("Уведомления: 3 непрочитанных мема (демо)"));
$("#avatar-btn").addEventListener("click", () => toast("Профиль — псевдо-ссылка"));
$("#search-input").addEventListener("input", (e) => {
  state.query = e.target.value.trim();
  if (!$("#view-post").hidden) location.hash = "";
  else { state.profileTab = "bookmarks"; renderProfile(); }
});
/* общий обработчик псевдо-ссылок (data-toast) */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-toast]");
  if (!b) return;
  e.preventDefault();
  toast(b.dataset.toast, b.dataset.toastTitle || null);
});
$("#footer-links").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-stub]");
  if (!a) return;
  e.preventDefault();
  toast(a.dataset.stub + " — псевдо-ссылка");
});

/* ---------- Старт ---------- */
renderChrome();
route();
</script>
</body>
</html>
